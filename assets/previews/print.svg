<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180" role="img" aria-labelledby="title">
<title id="title">동일한 산술 문제의 문제지와 정답지 예시</title>
<defs><radialGradient id="glow"><stop stop-color="#ffce91" stop-opacity=".15"/><stop offset="1" stop-color="#ffce91" stop-opacity="0"/></radialGradient></defs>
<rect width="360" height="180" fill="#0a101c"/><ellipse cx="280" cy="80" rx="180" ry="150" fill="url(#glow)"/>
<g font-family="system-ui, sans-serif"><g transform="rotate(-6 103 90)"><rect x="39" y="15" width="128" height="153" rx="4" fill="#e9e7de" stroke="#e9e7de"/><text x="52" y="38" font-size="10" fill="#24374d" >WORKSHEET</text><path d="M52 47h100" fill="none" stroke="#adb6bb" stroke-width="1.5"/><text x="52" y="76" font-size="17" fill="#24374d" >7 + 5 = □</text><text x="52" y="108" font-size="17" fill="#24374d" >9 − 3 = □</text><text x="52" y="140" font-size="17" fill="#24374d" >4 × 2 = □</text></g><g transform="rotate(5 255 90)"><rect x="194" y="23" width="128" height="145" rx="4" fill="#1d2c3c" stroke="#e4be8c"/><text x="208" y="46" font-size="10" fill="#ffce91" >ANSWER KEY</text><text x="208" y="80" font-size="16" fill="#dbe5f5" >7 + 5 = 12</text><text x="208" y="112" font-size="16" fill="#dbe5f5" >9 − 3 = 6</text><text x="208" y="144" font-size="16" fill="#dbe5f5" >4 × 2 = 8</text></g></g></svg>